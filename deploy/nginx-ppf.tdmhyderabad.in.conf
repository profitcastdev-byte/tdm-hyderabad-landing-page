# ============================================================================
#  ppf.tdmhyderabad.in — static landing page
#  Place at: /etc/nginx/sites-available/ppf.tdmhyderabad.in
#  Enable:   ln -s /etc/nginx/sites-available/ppf.tdmhyderabad.in \
#                  /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#
#  Run certbot FIRST (see deploy/RUNBOOK.md) — it writes the ssl_certificate
#  lines itself. Until then, comment out the 443 block and serve on 80.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ppf.tdmhyderabad.in;

    # certbot needs this reachable over plain http to issue/renew
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ppf.tdmhyderabad.in;

    root /var/www/ppf.tdmhyderabad.in;
    index index.html;

    # --- certbot fills these in ---
    # ssl_certificate     /etc/letsencrypt/live/ppf.tdmhyderabad.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ppf.tdmhyderabad.in/privkey.pem;

    # --- compression: the CSS/JS/HTML are all text and compress ~4x ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/json;

    # --- caching ---
    # Filenames are not fingerprinted, so nothing gets a 1-year immutable
    # cache: a redeploy would leave visitors on stale CSS. Photos rarely
    # change, so they get longer.
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff"            always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN"         always;

    location / { try_files $uri $uri/ =404; }

    # don't serve the repo's dev-only bits if the whole folder was copied
    location ~ ^/(\.git|\.claude|deploy|content)/ { deny all; }
}
